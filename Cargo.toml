[package]
name = "anontokyo"
version = "0.1.0"
edition = "2024"
description = "System-wide audio effects daemon for PipeWire: bass/vocal/treble boosts + parametric EQ"
license = "MIT"

[dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arc-swap = "1"
rtrb = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
